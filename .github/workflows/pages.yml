name: Publish BridgeFS Pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - 'BridgeFS-0.1/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          python3 - <<'PY'
          import os, base64, re
          s = os.environ['KEYSTORE_B64']
          m = re.search(r'===\s*B64_START\s*===(.*?)===\s*B64_END\s*===', s, re.S)
          if m:
              s = m.group(1)
          s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
          with open(os.path.expanduser('~/.android/debug.keystore'), 'wb') as f:
              f.write(base64.b64decode(s))
          PY
      - name: Build APK
        run: gradle :app:assembleDebug
        working-directory: BridgeFS-0.1
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp BridgeFS-0.1/app/build/outputs/apk/debug/*.apk _site/BridgeFS.apk
          printf '%s\n' 'BridgeFS APK' > _site/README.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
