name: Gen Debug Keystore (one-shot)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "===B64_START==="
          base64 -w0 /tmp/debug.keystore
          echo ""
          echo "===B64_END==="
