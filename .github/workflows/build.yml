name: Build BridgeFS APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          python3 - <<'PY'
          import os, base64, re
          s = os.environ['KEYSTORE_B64']
          m = re.search(r'===\s*B64_START\s*===(.*?)===\s*B64_END\s*===', s, re.S)
          if m:
              s = m.group(1)
          s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
          data = base64.b64decode(s)
          with open(os.path.expanduser('~/.android/debug.keystore'), 'wb') as f:
              f.write(data)
          print('keystore bytes:', len(data))
          PY
          sha256sum ~/.android/debug.keystore
      - run: gradle :app:assembleDebug
        working-directory: BridgeFS-0.1
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeFS-v0.1.2
          path: BridgeFS-0.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish latest APK to main release path
        run: |
          cp BridgeFS-0.1/app/build/outputs/apk/debug/*.apk release/BridgeFS.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/BridgeFS.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "release: update latest APK [skip ci]"
          git push
