name: Build BridgeFS APK
on:
  push:
    paths:
      - 'BridgeFS-0.1/**'
      - '.github/workflows/build.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - first-batch-test
    paths:
      - 'BridgeFS-0.1/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          python3 - <<'PY'
          import os, base64, re
          s = os.environ['KEYSTORE_B64']
          m = re.search(r'===\s*B64_START\s*===(.*?)===\s*B64_END\s*===', s, re.S)
          if m:
              s = m.group(1)
          s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
          data = base64.b64decode(s)
          with open(os.path.expanduser('~/.android/debug.keystore'), 'wb') as f:
              f.write(data)
          PY
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
        working-directory: BridgeFS-0.1
      - name: Verify APK signer certificate
        working-directory: BridgeFS-0.1
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk_path" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2}')"
          echo "APK signer SHA-256: $actual"
          test "$actual" = "e29b2fbf709570662a209fc0b88544a1cdf7a42a53cc4b9b5559f5fdf52bfd69"
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeFS-v0.1.2
          path: BridgeFS-0.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
